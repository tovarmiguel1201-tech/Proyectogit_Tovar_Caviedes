services:

  mongodb:
    image: mongo:7
    container_name: evah-mongodb
    ports:
      - "27017:27017"

  postgres:
    image: postgres:16
    container_name: evah-postgres
    environment:
      POSTGRES_DB: evah
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"

  mysql:
    image: mysql:8
    container_name: evah-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: evah
      MYSQL_USER: admin
      MYSQL_PASSWORD: 123456
    ports:
      - "3306:3306"